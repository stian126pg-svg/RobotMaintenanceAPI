services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: robotmaintenance
      POSTGRES_USER: robotadmin
      POSTGRES_PASSWORD: robotpassword
    ports:
      - "5432:5432"
    volumes:
      - robot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U robotadmin -d robotmaintenance
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__RobotDatabase: "Host=postgres;Port=5432;Database=robotmaintenance;Username=robotadmin;Password=robotpassword"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://localhost:8080/health > /dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  pgadmin:
    image: dpage/pgadmin4:9.17
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@robotmaintenance.com
      PGADMIN_DEFAULT_PASSWORD: robotadminpassword
      PGADMIN_DISABLE_POSTFIX: "true"
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  robot-postgres-data:
  pgadmin-data: