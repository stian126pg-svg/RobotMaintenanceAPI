services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: robotmaintenance
      POSTGRES_USER: robotadmin
      POSTGRES_PASSWORD: robotpassword
    ports:
      - "5432:5432"
    volumes:
      - robot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U robotadmin -d robotmaintenance
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__RobotDatabase: "Host=postgres;Port=5432;Database=robotmaintenance;Username=robotadmin;Password=robotpassword"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  robot-postgres-data: